# Read contract for the vrf_rd generator (generators/vrf_rd.py).
#
# $vrf is the target (one run per member of the `vrfs` group).
#
# - IpamVRF.instances: the PEs that already carry the VRF, with their PE's
#   interfaces (loopback = the RD's IP part) and the interfaces bound today
#   (with their addresses' VRFs, to spot bindings IPAM contradicts).
# - IpamIPAddress in the VRF: where IPAM says the VRF is attached - every
#   interface holding such an address is an attachment of its device's
#   instance (created when missing). The device's interfaces come along so a
#   new instance's RD can be derived in the same run.
query vrf_rd($vrf: String!) {
  IpamVRF(name__value: $vrf) {
    edges {
      node {
        id
        name {
          value
        }
        vrf_id {
          value
        }
        instances {
          edges {
            node {
              id
              route_distinguisher {
                value
              }
              rd_mode {
                value
              }
              interfaces {
                edges {
                  node {
                    id
                    ... on DcimInterface {
                      name {
                        value
                      }
                    }
                    ... on InterfaceLayer3 {
                      ip_addresses {
                        edges {
                          node {
                            vrf {
                              node {
                                name {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              device {
                node {
                  id
                  name {
                    value
                  }
                  ...DeviceLoopbacks
                }
              }
            }
          }
        }
      }
    }
  }
  IpamIPAddress(vrf__name__value: $vrf) {
    edges {
      node {
        address {
          value
        }
        interface {
          node {
            id
            ... on DcimInterface {
              name {
                value
              }
              device {
                node {
                  id
                  name {
                    value
                  }
                  ...DeviceLoopbacks
                }
              }
            }
            ... on InterfaceLayer2 {
              l2_mode {
                value
              }
            }
          }
        }
      }
    }
  }
}

fragment DeviceLoopbacks on DcimGenericDevice {
  interfaces {
    edges {
      node {
        name {
          value
        }
        ... on InterfaceLayer3 {
          ip_addresses {
            edges {
              node {
                address {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
