query observability_capability {
  IntentObservabilitySignal {
    edges {
      node {
        name {
          value
        }
        signal {
          value
        }
        watches {
          node {
            name {
              value
            }
            ... on IntentRoutingContract {
              pe_devices {
                edges {
                  node {
                    name {
                      value
                    }
                    ... on DcimPhysicalDevice {
                      device_type {
                        node {
                          name {
                            value
                          }
                          capabilities {
                            edges {
                              node {
                                name {
                                  value
                                }
                                category {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                    ... on DcimVirtualDevice {
                      device_type {
                        node {
                          name {
                            value
                          }
                          capabilities {
                            edges {
                              node {
                                name {
                                  value
                                }
                                category {
                                  value
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
