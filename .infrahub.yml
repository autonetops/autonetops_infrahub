---
# Intent pipeline wiring.
#
#   queries           - the read contracts every check/compiler consumes
#   check_definitions - semantic invariants; they gate Proposed Changes
#   python_transforms + artifact_definitions - the compiler: intent in,
#       configs + expectations + observability bundles out
#
# Group targets (created by scripts/bootstrap.py):
#   network_devices         - every routing node (config artifacts)
#   monitored_devices       - devices with telemetry requirements
#   routing_contracts       - IntentRoutingContract nodes (targeted checks +
#                             expectation + intent-series artifacts)
#   observability_contracts - IntentObservabilityContract nodes (alert-rule
#                             artifacts)
#   intent_tenants          - IntentTenant nodes (dashboards)
#   edge_bgp                - the edge pair whose bgp_local_pref the generator swaps
#   vrfs                    - IpamVRF nodes whose per-PE route distinguishers the
#                             vrf_rd generator writes

# SD-WAN disabled 2026-11-18 (schema removed from Infrahub to cut load); uncomment to re-enable.
schemas:
  - schemas/loadbalancer.yml
  - schemas/certificate.yml
  - schemas/ipam_vrf.yml
#  - schemas/dcim_bgp.yml
#   - schemas/sdwan.yml

menus:
  - menus/menu-intent.yml
  - menus/menu-loadbalancer.yml
#   - menus/sdwan.yml

queries:
  - name: contract_no_leak
    file_path: "queries/contract_no_leak.gql"
  - name: contract_prefix_authorization
    file_path: "queries/contract_prefix_authorization.gql"
  - name: observability_capability
    file_path: "queries/observability_capability.gql"
  - name: device_config
    file_path: "queries/device_config.gql"
  - name: contract_expectations
    file_path: "queries/contract_expectations.gql"
  - name: telemetry_collector
    file_path: "queries/telemetry_collector.gql"
  - name: prometheus_rules
    file_path: "queries/prometheus_rules.gql"
  - name: grafana_dashboard
    file_path: "queries/grafana_dashboard.gql"
  - name: edge_bgp_local_pref
    file_path: "queries/edge_bgp_local_pref.gql"
  - name: signal_predicate
    file_path: "queries/signal_predicate.gql"
  - name: f5_config
    file_path: "queries/f5_config.gql"
  - name: vrf_rd
    file_path: "queries/vrf_rd.gql"
  - name: vrf_instance_integrity
    file_path: "queries/vrf_instance_integrity.gql"
#   - name: get_sdwan_nac_data
#     file_path: "queries/sdwan.gql"

check_definitions:
  # global: RD unique network-wide, members routed + single-VRF (M-11)
  - name: vrf_instance_integrity_check
    class_name: VrfInstanceIntegrityCheck
    file_path: "checks/vrf_instance_integrity.py"
  - name: signal_predicate_check
    class_name: SignalPredicateCheck
    file_path: "checks/signal_predicate.py"
  - name: observability_capability_check
    class_name: ObservabilityCapabilityCheck
    file_path: "checks/observability_capability.py"
  - name: contract_no_leak_check
    class_name: ContractNoLeakCheck
    file_path: "checks/contract_no_leak.py"
    targets: routing_contracts
    parameters:
      contract: name__value
  - name: contract_prefix_authorization_check
    class_name: ContractPrefixAuthorizationCheck
    file_path: "checks/contract_prefix_authorization.py"
    targets: routing_contracts
    parameters:
      contract: name__value

generator_definitions:
  - name: edge_bgp_local_pref
    class_name: EdgeBgpLocalPrefGenerator
    file_path: "generators/edge_bgp_local_pref.py"
    query: edge_bgp_local_pref
    targets: edge_bgp
    parameters:
      device: name__value
  # per-PE RD = <PE Loopback0>:<vrf_id> on every IpamVRFInstance (rd_mode auto)
  - name: vrf_rd
    class_name: VrfRdGenerator
    file_path: "generators/vrf_rd.py"
    query: vrf_rd
    targets: vrfs
    parameters:
      vrf: name__value

python_transforms:
  - name: device_config
    class_name: DeviceConfigTransform
    file_path: "transforms/device_config.py"
  - name: contract_expectations
    class_name: ContractExpectationsTransform
    file_path: "transforms/contract_expectations.py"
  - name: intent_series
    class_name: IntentSeriesTransform
    file_path: "transforms/intent_series.py"
  - name: telemetry_collector
    class_name: TelemetryCollectorTransform
    file_path: "transforms/telemetry_collector.py"
  - name: prometheus_rules
    class_name: PrometheusRulesTransform
    file_path: "transforms/prometheus_rules.py"
  - name: grafana_dashboard
    class_name: GrafanaDashboardTransform
    file_path: "transforms/grafana_dashboard.py"
  - name: f5_config
    class_name: F5ConfigTransform
    file_path: "transforms/f5_config.py"
#   - name: sdwan_nac_export
#     class_name: SdwanNacExport
#     file_path: "transforms/sdwan_transform.py"

artifact_definitions:
  - name: device-configuration
    artifact_name: device-configuration
    content_type: text/plain
    targets: network_devices
    transformation: device_config
    parameters:
      device: name__value

  - name: telegraf-inputs
    artifact_name: telegraf-inputs
    content_type: text/plain
    targets: monitored_devices
    transformation: telemetry_collector
    parameters:
      device: name__value

  - name: contract-expectations
    artifact_name: contract-expectations
    content_type: text/plain
    targets: routing_contracts
    transformation: contract_expectations
    parameters:
      contract: name__value

  # what the intent EXPECTS, as Prometheus recording rules
  # (intent_session_info / intent_threshold) - the join target of every
  # contract-scoped alert rule; see transforms/signal_catalog.py
  - name: intent-series
    artifact_name: intent-series
    content_type: text/plain
    targets: routing_contracts
    transformation: intent_series
    parameters:
      contract: name__value

  - name: prometheus-rules
    artifact_name: prometheus-rules
    content_type: text/plain
    targets: observability_contracts
    transformation: prometheus_rules
    parameters:
      contract: name__value

  - name: grafana-dashboard
    artifact_name: grafana-dashboard
    content_type: application/json
    targets: intent_tenants
    transformation: grafana_dashboard
    parameters:
      tenant: name__value

  # F5 LTM desired state (YAML) per load balancer; transforms/f5_config.py.
  # Pushed to the box by the Terraform module in terraform/f5_ltm.
  - name: f5-ltm-configuration
    artifact_name: f5-ltm-configuration
    content_type: application/yaml
    targets: load_balancers
    transformation: f5_config
    parameters:
      device: name__value

#   - name: sdwan-nac
#     artifact_name: sdwan-nac
#     content_type: application/yaml
#     targets: sdwan_instances
#     transformation: sdwan_nac_export
#     parameters:
#       instance_name: name__value
